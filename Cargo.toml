[workspace]
resolver = "2"
members = [
    "crates/be_common",
    "crates/batch_encryption",
    "crates/batch_encryption_short",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
ark-bls12-381 = "0.5"
ark-ec = { version = "0.5", features = ["parallel"] }
ark-ff = { version = "0.5", features = ["parallel"] }
ark-poly = { version = "0.5", features = ["parallel"] }
ark-serialize = "0.5"
ark-std = { version = "0.5", features = ["parallel"] }
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1.10"
sha2 = "0.10"
